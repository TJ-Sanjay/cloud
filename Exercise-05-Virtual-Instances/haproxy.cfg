# Lab example only. Replace backend addresses with the actual private IPs.
global
    log /dev/log local0
    maxconn 2048

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend cloud_lab_frontend
    bind *:80
    default_backend cloud_lab_backends

backend cloud_lab_backends
    balance roundrobin
    option httpchk GET /
    server backend1 192.168.56.101:8080 check
    server backend2 192.168.56.102:8080 check
