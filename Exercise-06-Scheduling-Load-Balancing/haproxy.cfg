# Replace these sample IPs with your actual backend VM private IPs.
global
    log /dev/log local0
    maxconn 2048

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend lab_http
    bind *:80
    default_backend lab_backends

backend lab_backends
    balance roundrobin
    option httpchk GET /
    server vm1 192.168.56.101:8080 check
    server vm2 192.168.56.102:8080 check
